name: Update game data

on:
  schedule:
    - cron: '0 12 * * 2' # Tuesdays: Wild Rift patches usually land on Wednesdays/Thursdays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-data.mjs
      - run: node scripts/check-i18n.mjs
      - name: Commit changes
        run: |
          git config user.name "riftbuild-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public
          git diff --cached --quiet || git commit -m "chore(data): refresh roster, patch and icons" && git push
