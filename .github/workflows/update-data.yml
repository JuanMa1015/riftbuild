name: Update game data

on:
  schedule:
    - cron: '0 12 * * 2' # Tuesdays: Wild Rift patches usually land on Wednesdays/Thursdays
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/update-data.mjs
      - run: node scripts/check-i18n.mjs
      - run: node scripts/check-game.mjs
      - name: Patch digest (opens an issue when the latest patch touches our items)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/patch-digest.mjs > digest.md || true
          if [ -s digest.md ]; then
            title=$(head -1 digest.md | sed 's/^## //')
            if [ "$(gh issue list --state all --search "\"$title\" in:title" --json number --jq length)" = "0" ]; then
              gh issue create --title "$title" --body-file digest.md
            fi
          fi
      - name: Commit changes
        run: |
          git config user.name "riftbuild-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public
          git diff --cached --quiet || git commit -m "chore(data): refresh roster, patch and icons" && git push

  # Optional: needs the OPENROUTER_API_KEY secret and "Allow GitHub Actions to create pull requests" in repo settings.
  propose:
    needs: update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Propose build changes as a pull request
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$OPENROUTER_API_KEY" ] || exit 0
          node scripts/patch-digest.mjs > digest.md || true
          [ -s digest.md ] || exit 0
          node scripts/propose-builds.mjs digest.md || exit 0
          # never open a PR with a file the app would reject
          node scripts/check-game.mjs || { git checkout public/data/game.json; exit 0; }
          git diff --quiet public/data/game.json && exit 0
          branch="auto/builds-$(date +%Y%m%d)"
          git config user.name "riftbuild-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add public/data/game.json
          git commit -m "chore(builds): propuesta automática según las notas del parche"
          git push -f origin "$branch"
          gh pr create --base main --head "$branch" --title "Propuesta de builds: $(head -1 digest.md | sed 's/^## //')" --body-file proposal.md || true
